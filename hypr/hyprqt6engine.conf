# hyprqt6engine — Qt6 platform theme for Hyprland.
#
# Format is Hyprlang (category:key = value), NOT ini. There are no [section]
# headers; a stray [theme] block would be parsed as unknown keys and silently
# ignored, leaving Qt apps on the default light palette.
#
# Location: this file must be at ~/.config/hypr/hyprqt6engine.conf. Verified
# empirically against the installed hyprqt6engine-git build, which logs
# "could not find config in HOME, XDG_CONFIG_HOME, XDG_CONFIG_DIRS or /etc/hypr"
# when the file sits at the bare ~/.config/hyprqt6engine.conf instead. Note the
# Hyprland wiki states the opposite; upstream's current source has since changed
# the lookup, so re-test with `partitionmanager` if the package is updated and
# the theme silently reverts to light.
#
# color_scheme must be an absolute path: loadColorScheme() does no ~ expansion.
# It accepts a KColorScheme (*.colors) or a qt6ct theme ini. This build links no
# KF libs and has no createApplicationPalette symbol, so the .colors branch is
# compiled out — the qt6ct file below is the format that actually works.
#
# That file is Noctalia's own "qt" builtin template output. The path is fixed,
# not per-palette, so it is rewritten in place on every theme change and this
# config theme-syncs automatically with no further edits.
#
# Kvantum must not be installed: it registers a Qt style that paints with its own
# palette and discards the one loaded here, which renders every Qt app flat grey.
# `sudo pacman -Rs kvantum` — it is orphaned, nothing requires it.
theme:color_scheme = @@HOME@@/.config/qt6ct/colors/noctalia.conf
theme:icon_theme = Tela-circle-dark
